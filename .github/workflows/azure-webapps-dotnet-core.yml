name: Build and Deploy ASP.NET Core Web API to Azure Web App Slot

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: AzureInsightsMonitoringApi
  AZURE_SLOT_NAME: azureinsightsmonitoringapi-preprod
  DOTNET_VERSION: 10.0.x
  PROJECT_PATH: ./AzureMonitoringApp.API/AzureMonitoringApp.API.csproj

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 2: Setup .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # STEP 3: Restore dependencies
      - name: Restore Dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      # STEP 4: Build project
      - name: Build Project
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      # STEP 5: Run tests (optional)
      - name: Run Tests
        run: dotnet test ${{ env.PROJECT_PATH }} --no-build --verbosity normal
        continue-on-error: true

      # STEP 6: Publish app
      - name: Publish Web API
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish

      # STEP 7: Azure Login using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # STEP 8: Verify slot exists
      - name: Verify Azure Web App Slot
        run: |
          az webapp deployment slot list \
            --name AzureInsightsMonitoringApi \
            --resource-group insights-rg \
            --query "[].name"

      # STEP 9: Deploy to Azure Web App Slot
      - name: Deploy to Azure Web App Slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_SLOT_NAME }}
          package: ./publish

      # STEP 10: Optional Slot Swap to Production
      # Uncomment if you want auto swap after successful deployment
      # - name: Swap Slot to Production
      #   run: |
      #     az webapp deployment slot swap \
      #       --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
      #       --name ${{ env.AZURE_WEBAPP_NAME }} \
      #       --slot ${{ env.AZURE_SLOT_NAME }} \
      #       --target-slot production
