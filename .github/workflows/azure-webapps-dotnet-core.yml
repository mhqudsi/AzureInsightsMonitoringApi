name: Build and Deploy ASP.NET Core Web API to Azure Web App

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: AzureInsightsMonitoringApi
  DOTNET_VERSION: 10.0.x
  PROJECT_PATH: ./AzureMonitoringApp.API/AzureMonitoringApp.API.csproj

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 2: Setup .NET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # STEP 3: Restore dependencies
      - name: Restore Dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      # STEP 4: Build project
      - name: Build Project
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      # STEP 5: Run tests (optional but recommended)
      - name: Run Tests
        run: dotnet test ${{ env.PROJECT_PATH }} --no-build --verbosity normal
        continue-on-error: true

      # STEP 6: Publish app
      - name: Publish Web API
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish

      # STEP 7: Azure Login using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # STEP 8: Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AzureInsightsMonitoringApi'
          package: ./publish
